<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subir foto — Álbum de Aída</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
<style>
  .upload-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  .upload-wrap h1 { font-family: "Caveat", cursive; font-size: 2.4rem; text-align: center; margin-bottom: 4px; }
  .upload-wrap p.lead { text-align: center; color: var(--muted); margin-top: 0; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 1.1rem; margin-bottom: 6px; }
  .field input[type="text"] {
    width: 100%;
    font-family: "Patrick Hand", sans-serif;
    font-size: 1rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--card-bg);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    user-select: none;
    background: var(--card-bg);
    font-family: "Patrick Hand", sans-serif;
  }
  .chip.selected { background: var(--tape-1); color: #fff8ef; border-color: var(--tape-1); }
  .btn {
    font-family: "Patrick Hand", sans-serif;
    font-size: 1.15rem;
    border: 2px solid var(--ink);
    background: var(--tape-1);
    color: #fff8ef;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-link {
    background: none;
    border: none;
    text-decoration: underline;
    color: var(--ink);
    cursor: pointer;
    font-family: "Patrick Hand", sans-serif;
    font-size: 0.95rem;
    padding: 0;
  }
  .preview {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    margin: 10px 0;
    border: 2px solid var(--ink);
    background: #fff;
    display: none;
  }
  .status { text-align: center; margin-top: 16px; font-size: 1.05rem; min-height: 1.4em; }
  .status.error { color: #a33322; }
  .status.ok { color: #4a7a3a; }
  a.back { display: block; text-align: center; margin-top: 24px; color: var(--ink); }

  .divider { border: none; border-top: 2px dashed var(--border, #ddccA6); margin: 36px 0 24px; }

  .manage-toggle { text-align: center; }

  .manage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .manage-item { position: relative; }
  .manage-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 2px solid var(--ink);
    display: block;
  }
  .manage-item button {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #a33322;
    color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
  }
  .manage-item button:disabled { opacity: .5; }
  .manage-empty { text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="upload-wrap">
  <h1>Añadir una foto 📸</h1>
  <p class="lead">Se sube directamente al álbum de Aída</p>

  <div class="field">
    <label for="fileInput">Elige una foto de tu galería (o haz una nueva)</label>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" class="preview" alt="">
  </div>

  <div class="field">
    <label>¿Con quién sale? (opcional, puedes marcar varias)</label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="field">
    <label for="caption">Un texto o recuerdo (opcional)</label>
    <input type="text" id="caption" maxlength="140" placeholder="Ej: Verano en la playa">
  </div>

  <button class="btn" id="submitBtn">Subir foto</button>
  <p class="status" id="status"></p>
  <p style="text-align:center;"><button class="btn-link" id="tokenBtn">Cambiar clave de acceso</button></p>

  <hr class="divider">

  <div class="manage-toggle">
    <button class="btn-link" id="manageToggle">Ver y eliminar fotos del álbum</button>
  </div>
  <div id="manageSection" hidden>
    <p class="status" id="manageStatus"></p>
    <div class="manage-grid" id="manageGrid"></div>
  </div>

  <a class="back" href="index.html">← Volver al álbum</a>
</div>

<script src="js/data.js?v=5"></script>
<script>
(function () {
  const OWNER = "jaimeferrer";
  const REPO = "albumaida";
  const BRANCH = "main";
  const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const chipsEl = document.getElementById("chips");
  const captionEl = document.getElementById("caption");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const tokenBtn = document.getElementById("tokenBtn");
  const manageToggle = document.getElementById("manageToggle");
  const manageSection = document.getElementById("manageSection");
  const manageGrid = document.getElementById("manageGrid");
  const manageStatus = document.getElementById("manageStatus");

  let selectedFile = null;
  const selectedCategories = new Set();

  function getToken(forcePrompt) {
    let token = localStorage.getItem("aida_gh_token");
    if (!token || forcePrompt) {
      token = prompt(
        "Pega aquí la clave de acceso de GitHub (se guarda solo en este dispositivo, nunca se sube al repositorio).\n\n" +
        "¿No la tienes? Pídesela a Jaime."
      );
      if (token) localStorage.setItem("aida_gh_token", token.trim());
    }
    return token ? token.trim() : null;
  }

  tokenBtn.addEventListener("click", () => getToken(true));

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });

  // Las categorías (CATEGORY_LABELS) llegan ya cargadas desde js/data.js,
  // así este formulario nunca se desincroniza de las etiquetas existentes.
  Object.keys(CATEGORY_LABELS).forEach((key) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = CATEGORY_LABELS[key];
    chip.addEventListener("click", () => {
      chip.classList.toggle("selected");
      if (chip.classList.contains("selected")) selectedCategories.add(key);
      else selectedCategories.delete(key);
    });
    chipsEl.appendChild(chip);
  });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  // Redimensiona/comprime la foto con un <canvas>. Si el navegador no
  // puede decodificarla (pasa a veces con HEIC), sube el archivo tal cual.
  function prepareImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxSide = 1600;
        let { width, height } = img;
        if (width > maxSide || height > maxSide) {
          const ratio = Math.min(maxSide / width, maxSide / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(
          (blob) => resolve(blob ? { blob, ext: "jpg" } : { blob: file, ext: extOf(file.name) }),
          "image/jpeg",
          0.85
        );
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        resolve({ blob: file, ext: extOf(file.name) });
      };
      img.src = url;
    });
  }

  function extOf(name) {
    const m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
    return (m ? m[1] : "jpg").toLowerCase();
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Codifica/decodifica texto UTF-8 <-> base64 de forma segura (para
  // poder editar data.js, que tiene tildes y eñes).
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64ToUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  async function ghRequest(path, options) {
    const token = getToken(false);
    if (!token) throw new Error("Falta la clave de acceso.");
    const res = await fetch(API + path, {
      ...options,
      headers: {
        Authorization: "Bearer " + token,
        Accept: "application/vnd.github+json",
        ...((options && options.headers) || {}),
      },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      if (res.status === 401) {
        localStorage.removeItem("aida_gh_token");
        throw new Error("Clave de acceso inválida o caducada. Vuelve a intentarlo.");
      }
      throw new Error(`GitHub respondió ${res.status}: ${body.slice(0, 200)}`);
    }
    // DELETE responde 200 con cuerpo; devolvemos igualmente el JSON si lo hay.
    return res.status === 204 ? null : res.json();
  }

  async function uploadImageFile(base64, ext) {
    const filename = `images/upload-${Date.now()}.${ext}`;
    await ghRequest(`/contents/${filename}`, {
      method: "PUT",
      body: JSON.stringify({
        message: `Sube foto desde la web: ${filename}`,
        content: base64,
        branch: BRANCH,
      }),
    });
    return filename;
  }

  // Aplica `editFn` (texto actual -> texto nuevo) sobre js/data.js con
  // reintentos, por si dos personas suben/borran una foto casi a la vez.
  async function editDataJs(editFn) {
    for (let attempt = 0; attempt < 3; attempt++) {
      const current = await ghRequest(`/contents/js/data.js?ref=${BRANCH}`, { method: "GET" });
      const text = base64ToUtf8(current.content);
      const updated = editFn(text);
      if (updated === null) return; // editFn señaliza "nada que hacer"
      try {
        await ghRequest("/contents/js/data.js", {
          method: "PUT",
          body: JSON.stringify({
            message: "Actualiza data.js",
            content: utf8ToBase64(updated),
            sha: current.sha,
            branch: BRANCH,
          }),
        });
        return;
      } catch (err) {
        if (attempt === 2) throw err;
        await new Promise((r) => setTimeout(r, 600));
      }
    }
  }

  function addEntryToDataJs(filename, categories, caption) {
    const catsJs = "[" + categories.map((c) => `"${c}"`).join(", ") + "]";
    const safeCaption = caption.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    const line = `  { file: "${filename}", categories: ${catsJs}, caption: "${safeCaption}" },\n];`;
    return editDataJs((text) => {
      const updated = text.replace(/\n\];/, "\n" + line);
      if (updated === text) throw new Error("No se pudo editar data.js (formato inesperado).");
      return updated;
    });
  }

  function removeEntryFromDataJs(filename) {
    // Cada foto ocupa una única línea (así las genera esta misma página y
    // el resto del álbum), así que basta con quitar la línea que la cita.
    const escaped = filename.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const lineRe = new RegExp(`^[ \\t]*\\{[^\\n]*file:\\s*"${escaped}"[^\\n]*\\},?\\n`, "m");
    return editDataJs((text) => {
      if (!lineRe.test(text)) return null;
      return text.replace(lineRe, "");
    });
  }

  submitBtn.addEventListener("click", async () => {
    if (!selectedFile) {
      setStatus("Elige antes una foto.", "error");
      return;
    }
    if (!getToken(false)) {
      setStatus("Necesitas la clave de acceso para subir la foto.", "error");
      return;
    }

    submitBtn.disabled = true;
    try {
      setStatus("Preparando la foto…");
      const { blob, ext } = await prepareImage(selectedFile);

      setStatus("Subiendo la foto…");
      const base64 = await blobToBase64(blob);
      const filename = await uploadImageFile(base64, ext);

      setStatus("Añadiéndola al álbum…");
      await addEntryToDataJs(filename, [...selectedCategories], captionEl.value.trim());

      setStatus("¡Foto añadida! Ya está en el álbum (puede tardar un minuto en aparecer).", "ok");
      fileInput.value = "";
      preview.style.display = "none";
      selectedFile = null;
      captionEl.value = "";
      selectedCategories.clear();
      chipsEl.querySelectorAll(".chip.selected").forEach((c) => c.classList.remove("selected"));
      if (!manageSection.hidden) renderManageGrid();
    } catch (err) {
      setStatus(err.message || "Algo ha fallado. Inténtalo otra vez.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- Ver y eliminar fotos ----------

  function renderManageGrid() {
    manageGrid.innerHTML = "";
    if (!PHOTOS.length) {
      manageGrid.innerHTML = '<p class="manage-empty">No hay fotos todavía.</p>';
      return;
    }
    PHOTOS.forEach((photo) => {
      const item = document.createElement("div");
      item.className = "manage-item";

      const img = document.createElement("img");
      img.src = photo.file;
      img.alt = photo.caption || "";
      img.loading = "lazy";

      const del = document.createElement("button");
      del.textContent = "✕";
      del.title = "Eliminar esta foto";
      del.addEventListener("click", () => deletePhoto(photo.file, item, del));

      item.appendChild(img);
      item.appendChild(del);
      manageGrid.appendChild(item);
    });
  }

  async function deletePhoto(filename, itemEl, btnEl) {
    if (!getToken(false)) {
      manageStatus.textContent = "Necesitas la clave de acceso para eliminar fotos.";
      manageStatus.className = "status error";
      return;
    }
    if (!confirm("¿Seguro que quieres eliminar esta foto del álbum? No se puede deshacer.")) return;

    btnEl.disabled = true;
    manageStatus.textContent = "Eliminando…";
    manageStatus.className = "status";
    try {
      // 1) Quita primero la entrada de data.js, así la foto desaparece del
      //    álbum aunque falle el segundo paso.
      await removeEntryFromDataJs(filename);

      // 2) Borra el archivo de la imagen (si esto falla, no pasa nada grave:
      //    solo queda un archivo huérfano sin usar).
      try {
        const info = await ghRequest(`/contents/${filename}?ref=${BRANCH}`, { method: "GET" });
        await ghRequest(`/contents/${filename}`, {
          method: "DELETE",
          body: JSON.stringify({
            message: `Elimina foto: ${filename}`,
            sha: info.sha,
            branch: BRANCH,
          }),
        });
      } catch (imgErr) {
        console.warn("No se pudo borrar el archivo de imagen:", imgErr);
      }

      itemEl.remove();
      manageStatus.textContent = "Foto eliminada del álbum.";
      manageStatus.className = "status ok";
    } catch (err) {
      manageStatus.textContent = err.message || "No se ha podido eliminar la foto.";
      manageStatus.className = "status error";
      btnEl.disabled = false;
    }
  }

  manageToggle.addEventListener("click", () => {
    const show = manageSection.hidden;
    manageSection.hidden = !show;
    manageToggle.textContent = show ? "Ocultar fotos del álbum" : "Ver y eliminar fotos del álbum";
    if (show) renderManageGrid();
  });
})();
</script>
</body>
</html>
