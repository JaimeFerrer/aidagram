<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subir foto — Álbum de Aída</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
<style>
  .upload-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  .upload-wrap h1 { font-family: "Caveat", cursive; font-size: 2.4rem; text-align: center; margin-bottom: 4px; }
  .upload-wrap p.lead { text-align: center; color: var(--muted); margin-top: 0; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 1.1rem; margin-bottom: 6px; }
  .field input[type="text"] {
    width: 100%;
    font-family: "Patrick Hand", sans-serif;
    font-size: 1rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--card-bg);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .new-tag-row { display: flex; gap: 8px; margin-top: 10px; }
  .new-tag-row input[type="text"] {
    flex: 1;
    font-family: "Patrick Hand", sans-serif;
    font-size: 0.95rem;
    padding: 6px 10px;
    border: 2px dashed var(--ink);
    border-radius: 6px;
    background: var(--card-bg);
  }
  .new-tag-row button {
    font-family: "Patrick Hand", sans-serif;
    font-size: 0.95rem;
    border: 2px solid var(--ink);
    background: var(--card-bg);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip {
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    user-select: none;
    background: var(--card-bg);
    font-family: "Patrick Hand", sans-serif;
  }
  .chip.selected { background: var(--tape-1); color: #fff8ef; border-color: var(--tape-1); }
  .btn {
    font-family: "Patrick Hand", sans-serif;
    font-size: 1.15rem;
    border: 2px solid var(--ink);
    background: var(--tape-1);
    color: #fff8ef;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-link {
    background: none;
    border: none;
    text-decoration: underline;
    color: var(--ink);
    cursor: pointer;
    font-family: "Patrick Hand", sans-serif;
    font-size: 0.95rem;
    padding: 0;
  }
  .preview {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    margin: 10px 0;
    border: 2px solid var(--ink);
    background: #fff;
    display: none;
  }
  .status { text-align: center; margin-top: 16px; font-size: 1.05rem; min-height: 1.4em; }
  .status.error { color: #a33322; }
  .status.ok { color: #4a7a3a; }
  a.back { display: block; text-align: center; margin-top: 24px; color: var(--ink); }

  .divider { border: none; border-top: 2px dashed var(--border, #ddccA6); margin: 36px 0 24px; }

  .manage-toggle { text-align: center; }

  .manage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .manage-item { position: relative; }
  .manage-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 2px solid var(--ink);
    display: block;
  }
  .manage-item button {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #a33322;
    color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
  }
  .manage-item button:disabled { opacity: .5; }
  .manage-empty { text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="upload-wrap">
  <h1>Añadir una foto 📸</h1>
  <p class="lead">Se sube directamente al álbum de Aída</p>

  <div class="field">
    <label for="fileInput">Elige una foto de tu galería (o haz una nueva)</label>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" class="preview" alt="">
  </div>

  <div class="field">
    <label>¿Con quién sales? (opcional, puedes marcar varias)</label>
    <div class="chips" id="chips"></div>
    <div class="new-tag-row">
      <input type="text" id="newTagInput" maxlength="30" placeholder="¿Falta alguien? Escribe una etiqueta nueva">
      <button type="button" id="newTagBtn">＋ Crear</button>
    </div>
  </div>

  <div class="field">
    <label for="caption">Un texto o recuerdo (opcional)</label>
    <input type="text" id="caption" maxlength="140" placeholder="Ej: Verano en la playa">
  </div>

  <button class="btn" id="submitBtn">Subir foto</button>
  <p class="status" id="status"></p>
  <p style="text-align:center;"><button class="btn-link" id="tokenBtn">Cambiar clave de acceso</button></p>

  <hr class="divider">

  <div class="manage-toggle">
    <button class="btn-link" id="manageToggle">Ver y eliminar fotos del álbum</button>
  </div>
  <div id="manageSection" hidden>
    <p class="status" id="manageStatus"></p>
    <div class="manage-grid" id="manageGrid"></div>
  </div>

  <a class="back" href="index.html">← Volver al álbum</a>
</div>

<script src="js/data.js?v=6"></script>
<script src="js/gh-edit.js?v=1"></script>
<script>
(function () {
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const chipsEl = document.getElementById("chips");
  const captionEl = document.getElementById("caption");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const tokenBtn = document.getElementById("tokenBtn");
  const manageToggle = document.getElementById("manageToggle");
  const manageSection = document.getElementById("manageSection");
  const manageGrid = document.getElementById("manageGrid");
  const manageStatus = document.getElementById("manageStatus");
  const newTagInput = document.getElementById("newTagInput");
  const newTagBtn = document.getElementById("newTagBtn");

  let selectedFile = null;
  const selectedCategories = new Set();
  // Etiquetas creadas aquí mismo que todavía no existen en data.js y hay
  // que registrar en CATEGORY_LABELS la próxima vez que se suba una foto.
  const pendingNewLabels = {};

  tokenBtn.addEventListener("click", () => GH.getToken(true));

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });

  // Las categorías (CATEGORY_LABELS) llegan ya cargadas desde js/data.js,
  // así este formulario nunca se desincroniza de las etiquetas existentes.
  function addChip(key, label, selected) {
    const chip = document.createElement("div");
    chip.className = "chip" + (selected ? " selected" : "");
    chip.textContent = label;
    chip.addEventListener("click", () => {
      chip.classList.toggle("selected");
      if (chip.classList.contains("selected")) selectedCategories.add(key);
      else selectedCategories.delete(key);
    });
    chipsEl.appendChild(chip);
    if (selected) selectedCategories.add(key);
    return chip;
  }

  Object.keys(CATEGORY_LABELS).forEach((key) => addChip(key, CATEGORY_LABELS[key], false));

  // Convierte un texto libre ("Con la abuela") en una clave válida para
  // usar como categoría ("conlaabuela"), sin acentos ni espacios, y sin
  // chocar con una etiqueta que ya exista.
  function slugify(label) {
    let base = label
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "");
    if (!base) base = "etiqueta";
    let key = base;
    let i = 2;
    while (CATEGORY_LABELS[key]) key = base + i++;
    return key;
  }

  function createNewTag() {
    const label = newTagInput.value.trim();
    if (!label) return;
    const key = slugify(label);
    CATEGORY_LABELS[key] = label; // así el resto de la página ya la ve como existente
    pendingNewLabels[key] = label;
    addChip(key, label, true);
    newTagInput.value = "";
  }

  newTagBtn.addEventListener("click", createNewTag);
  newTagInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      createNewTag();
    }
  });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  // Redimensiona/comprime la foto con un <canvas>. Si el navegador no
  // puede decodificarla (pasa a veces con HEIC), sube el archivo tal cual.
  function prepareImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxSide = 1600;
        let { width, height } = img;
        if (width > maxSide || height > maxSide) {
          const ratio = Math.min(maxSide / width, maxSide / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(
          (blob) => resolve(blob ? { blob, ext: "jpg" } : { blob: file, ext: extOf(file.name) }),
          "image/jpeg",
          0.85
        );
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        resolve({ blob: file, ext: extOf(file.name) });
      };
      img.src = url;
    });
  }

  function extOf(name) {
    const m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
    return (m ? m[1] : "jpg").toLowerCase();
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  submitBtn.addEventListener("click", async () => {
    if (!selectedFile) {
      setStatus("Elige antes una foto.", "error");
      return;
    }
    if (!GH.getToken(false)) {
      setStatus("Necesitas la clave de acceso para subir la foto.", "error");
      return;
    }

    submitBtn.disabled = true;
    try {
      setStatus("Preparando la foto…");
      const { blob, ext } = await prepareImage(selectedFile);

      setStatus("Subiendo la foto…");
      const base64 = await blobToBase64(blob);
      const filename = await GH.uploadImageFile(base64, ext);

      setStatus("Añadiéndola al álbum…");
      await GH.addEntryToDataJs(filename, [...selectedCategories], captionEl.value.trim(), pendingNewLabels);
      Object.keys(pendingNewLabels).forEach((k) => delete pendingNewLabels[k]);

      setStatus("¡Foto añadida! Ya está en el álbum (puede tardar un minuto en aparecer).", "ok");
      fileInput.value = "";
      preview.style.display = "none";
      selectedFile = null;
      captionEl.value = "";
      selectedCategories.clear();
      chipsEl.querySelectorAll(".chip.selected").forEach((c) => c.classList.remove("selected"));
      if (!manageSection.hidden) renderManageGrid();
    } catch (err) {
      setStatus(err.message || "Algo ha fallado. Inténtalo otra vez.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- Ver y eliminar fotos ----------

  function renderManageGrid() {
    manageGrid.innerHTML = "";
    if (!PHOTOS.length) {
      manageGrid.innerHTML = '<p class="manage-empty">No hay fotos todavía.</p>';
      return;
    }
    PHOTOS.forEach((photo) => {
      const item = document.createElement("div");
      item.className = "manage-item";

      const img = document.createElement("img");
      img.src = photo.file;
      img.alt = photo.caption || "";
      img.loading = "lazy";

      const del = document.createElement("button");
      del.textContent = "✕";
      del.title = "Eliminar esta foto";
      del.addEventListener("click", () => deletePhoto(photo.file, item, del));

      item.appendChild(img);
      item.appendChild(del);
      manageGrid.appendChild(item);
    });
  }

  async function deletePhoto(filename, itemEl, btnEl) {
    if (!GH.getToken(false)) {
      manageStatus.textContent = "Necesitas la clave de acceso para eliminar fotos.";
      manageStatus.className = "status error";
      return;
    }
    if (!confirm("¿Seguro que quieres eliminar esta foto del álbum? No se puede deshacer.")) return;

    btnEl.disabled = true;
    manageStatus.textContent = "Eliminando…";
    manageStatus.className = "status";
    try {
      // 1) Quita primero la entrada de data.js, así la foto desaparece del
      //    álbum aunque falle el segundo paso.
      await GH.removeEntryFromDataJs(filename);

      // 2) Borra el archivo de la imagen (si esto falla, no pasa nada grave:
      //    solo queda un archivo huérfano sin usar).
      try {
        const info = await GH.ghRequest(`/contents/${filename}?ref=main`, { method: "GET" });
        await GH.ghRequest(`/contents/${filename}`, {
          method: "DELETE",
          body: JSON.stringify({
            message: `Elimina foto: ${filename}`,
            sha: info.sha,
            branch: "main",
          }),
        });
      } catch (imgErr) {
        console.warn("No se pudo borrar el archivo de imagen:", imgErr);
      }

      itemEl.remove();
      manageStatus.textContent = "Foto eliminada del álbum.";
      manageStatus.className = "status ok";
    } catch (err) {
      manageStatus.textContent = err.message || "No se ha podido eliminar la foto.";
      manageStatus.className = "status error";
      btnEl.disabled = false;
    }
  }

  manageToggle.addEventListener("click", () => {
    const show = manageSection.hidden;
    manageSection.hidden = !show;
    manageToggle.textContent = show ? "Ocultar fotos del álbum" : "Ver y eliminar fotos del álbum";
    if (show) renderManageGrid();
  });
})();
</script>
</body>
</html>
