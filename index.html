<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aídagram</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- Permite instalarla como app (Android/Chrome y, por separado, iOS) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c96a4d">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aídagram">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Grand+Hotel&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<header class="cover">
  <div class="cover-brand">
    <svg class="insta-badge" viewBox="0 0 120 120" role="img" aria-label="Cámara retro con la inicial de Aída">
      <defs>
        <clipPath id="bandClip">
          <path d="M28,2 H94 A26,26 0 0 1 118,26 V38 H2 V26 A26,26 0 0 1 28,2 Z" />
        </clipPath>
      </defs>

      <!-- cuerpo -->
      <rect x="2" y="2" width="116" height="116" rx="26" fill="#fff8ef" stroke="#4a2f1c" stroke-width="3" />

      <!-- banda superior -->
      <path d="M28,2 H94 A26,26 0 0 1 118,26 V38 H2 V26 A26,26 0 0 1 28,2 Z" fill="#4a2f1c" />

      <!-- rayas diagonales con la paleta del álbum -->
      <g clip-path="url(#bandClip)">
        <rect x="4" y="-6" width="11" height="52" fill="#c96a4d" transform="rotate(24 10 20)" />
        <rect x="16" y="-6" width="11" height="52" fill="#d1a53d" transform="rotate(24 22 20)" />
        <rect x="28" y="-6" width="11" height="52" fill="#8a9a63" transform="rotate(24 34 20)" />
        <rect x="40" y="-6" width="11" height="52" fill="#7d8fa6" transform="rotate(24 46 20)" />
      </g>

      <!-- mini cámara frontal -->
      <rect x="86" y="10" width="20" height="20" rx="6" fill="#2f2016" />
      <circle cx="96" cy="20" r="5" fill="#8a9aab" />

      <!-- cinta con su nombre, en vez de "Insta" -->
      <rect x="12" y="27" width="50" height="18" rx="4" fill="#2f2016" />
      <text x="37" y="40.5" font-family="'Grand Hotel', cursive" font-size="15" fill="#fff8ef" text-anchor="middle">Aída</text>

      <!-- objetivo -->
      <circle cx="60" cy="79" r="35" fill="#fff8ef" stroke="#4a2f1c" stroke-width="3" />
      <circle cx="60" cy="79" r="28" fill="#c96a4d" />
      <circle cx="60" cy="79" r="20" fill="#7d8fa6" />
      <circle cx="60" cy="79" r="12" fill="#2f2016" />
      <ellipse cx="51" cy="69" rx="8" ry="5" fill="#fff8ef" opacity="0.45" />
      <!-- monograma en el centro, en vez del punto genérico -->
      <text x="60" y="85" font-family="'Grand Hotel', cursive" font-size="18" fill="#fff8ef" text-anchor="middle">A</text>
    </svg>
    <h1 class="insta-title">Aídagram</h1>
  </div>
</header>

<div class="corkboard">

  <p class="subtitle">¡Feliz cumpleaños Moñi! 🎂<br>Un recorrido por tus recuerdos, con la gente que más te quiere.</p>

  <nav class="filters" id="filters">
    <!-- Los botones de filtro se generan automáticamente desde data.js -->
  </nav>

  <main class="album-page" id="grid">
    <!-- Las fotos se generan automáticamente desde data.js -->
  </main>

  <p class="empty-state" id="emptyState" hidden>
    Aún no hay fotos aquí. Añádelas en <code>images/</code> y regístralas en <code>js/data.js</code>.
  </p>

</div>

<a href="upload.html" class="fab" title="Añadir una foto">＋</a>
<button type="button" class="fab fab-refresh" id="refreshBtn" title="Actualizar fotos">🔄</button>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">✕</button>
  <div class="lightbox-polaroid" id="lightboxStop">
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
    <div class="lightbox-caption-edit" id="lightboxCaptionEdit" hidden>
      <input type="text" id="lightboxCaptionInput" maxlength="140" placeholder="Ej: Verano en la playa">
      <button id="lightboxCaptionSave">Guardar</button>
    </div>
    <button class="lightbox-edit-btn" id="lightboxEditBtn">✏️ Comentario</button>
  </div>
</div>

<script>
  // Carga data.js con un parámetro único cada vez (en vez de una versión
  // fija) para que ni el navegador ni la CDN de GitHub Pages sirvan una
  // copia antigua — importante sobre todo en la app instalada, donde no
  // hay barra de dirección con la que forzar un recarga dura.
  document.write('<script src="js/data.js?t=' + Date.now() + '"><\/script>');
</script>
<script src="js/gh-edit.js?v=2"></script>
<script src="js/app.js?v=8"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  document.getElementById("refreshBtn").addEventListener("click", () => location.reload());
</script>
</body>
</html>
